# Render Blueprint: runs DU Meet in the cloud so it works when the laptop is off.
# Render asks for the three secret values (sync: false) when the Blueprint is created.
services:
  - type: web
    name: du-meet
    runtime: python
    plan: free
    buildCommand: echo no build step needed
    startCommand: python3 -u server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DU_MEET_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD     # opens the admin console (sessions, chats, photos)
        sync: false
      # Permanent storage for memories, letters, calendar… (see supabase.sql)
      # Optional: song search inside Listen together
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY     # Saathi, the AI friend (aistudio.google.com)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # TURN with a fixed username/password (ExpressTURN free plan), or Cloudflare below
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
